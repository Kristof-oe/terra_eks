apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: app
  labels:
    app.kubernetes.io/name: load-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: load-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: load-agent
    spec:
      tolerations:
      - key: dedicated
        operator: Exists
        effect: NoSchedule
      containers:
        - image:  nginx:latest
          name:  nginx-docker
          ports:
          - containerPort: 8080
          volumeMounts:
            - name:  nginx-config-volume
              mountPath:  /etc/nginx/conf.d
      volumes:
      - name: nginx-config-volume
        configMap:
          name: nginx-config