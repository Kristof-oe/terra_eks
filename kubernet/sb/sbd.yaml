apiVersion: apps/v1
kind: Deployment
metadata:
  name: sb
  namespace: app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: serviceB
  template:
    metadata:
      labels:
        app: serviceB
    spec:
      containers:
      - name: sb
        # image:  ${ecr_image_url}
        image: 362099375729.dkr.ecr.eu-central-1.amazonaws.com/sb:6c2541c5b7954a88e677ee06f8f82dae77e40231
        ports:
        - containerPort: 8080
