apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: app
  labels:
    app: nginx
data:
  nginx.conf: |
    server {
    listen 8080;
    location /api/sa {
      proxy_pass http://sa.app.svc.cluster.local:8080;
      }
    location /api/sb {
      proxy_pass http://sb.app.svc.cluster.local:8080;
      }
    }
