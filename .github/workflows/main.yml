name: Terraform and kubectl deploy

on:
  push:
    branches: [main]

jobs:
  Terraform:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.0"

      - name: Init
        run: terraform init -backend-config="state.config"

      - name: Validate
        id: validate
        run: terraform validate

      - run: echo ${{ steps.validate.outputs.stdout}}
      - run: echo ${{ steps.validate.outputs.sterr}}
      - run: echo ${{ steps.validate.outputs.exitcode}}

      - name: Plan
        id: plan
        run: terraform plan

      - run: echo ${{ steps.plan.outputs.stdout}}
      - run: echo ${{ steps.plan.outputs.sterr}}
      - run: echo ${{ steps.plan.outputs.exitcode}}

      - name: Apply
        run: terraform apply

      - name: Manifest
        run: kubectl apply -R -f kubernet/
